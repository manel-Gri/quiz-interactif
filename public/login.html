
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejoindre - Quiz Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <h1>QUIZ TIME</h1>
        <h2>Rejoindre le quiz</h2>
        <p>Entre ton nom pour commencer à jouer !</p>

        <form id="loginForm">
            <input
                type="text"
                id="username"
                placeholder="Ton nom"
                minlength="2"
                maxlength="30"
                required
            >

            <button type="submit">Rejoindre</button>
        </form>

        <p id="message"></p>

        <a href="index.html">Retour</a>
    </div>

    <script src="script.js"></script>

</body>
</html>
